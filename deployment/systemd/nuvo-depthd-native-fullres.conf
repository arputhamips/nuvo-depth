[Unit]
Conflicts=nuvo-depthd.service

[Service]
ExecStart=
ExecStart=/usr/bin/depthd --run /etc/nuvo-depth/daemon.yaml --status /run/nuvo-depth/status.json --snapshot-dir /run/nuvo-depth/snapshots --device-identity /var/lib/nuvo-depth/identity/device.uuid --allow-provisional-depth --calibration-root /var/lib/nuvo-depthd/current/config/calibration/nuvo_depth_100mm --encoding-config /etc/nuvo-depth/encoding.json --stereo-control /etc/nuvo-depth/stereo.json

[Install]
WantedBy=multi-user.target

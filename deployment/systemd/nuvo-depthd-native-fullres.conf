[Unit]
Conflicts=nuvo-depthd.service

[Service]
ExecStart=
ExecStart=/usr/bin/depthd --run /etc/nuvo-depth/daemon.yaml --status /run/nuvo-depth/status.json --device-identity /var/lib/nuvo-depth/identity/device.uuid --allow-provisional-depth --encoding-config /etc/nuvo-depth/encoding.json --stereo-control /etc/nuvo-depth/stereo.json --exposure-control /etc/nuvo-depth/exposure.json

[Install]
WantedBy=multi-user.target

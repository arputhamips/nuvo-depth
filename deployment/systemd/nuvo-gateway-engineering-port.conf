[Service]
ExecStart=
ExecStart=/usr/lib/nuvo-depth/nuvo-gateway --address 0.0.0.0 --port 17443 --certificate /var/lib/nuvo-depth/identity/device.crt --private-key /var/lib/nuvo-depth/identity/device.key --token-file /var/lib/nuvo-depth/identity/claim.token --web-root /usr/share/nuvo-depth/web --status-file /run/nuvo-depth/status.json --snapshot-file /run/nuvo-depth/snapshots/latest.nuv --encoded-file /run/nuvo-depth/snapshots/latest.nve --encoding-config-file /etc/nuvo-depth/encoding.json --stereo-control-file /etc/nuvo-depth/stereo.json --system-agent-socket /run/nuvo-depth/system-agent.sock --maximum-sessions 16

[Install]
WantedBy=multi-user.target

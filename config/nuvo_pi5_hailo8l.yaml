schema_version: 1

capture:
  backend: libcamera
  # Verified on the supplied rig by disparity-direction testing. These are
  # logical assignments; keep them configurable because libcamera indices can
  # change if the physical topology changes.
  left_camera_index: 1
  right_camera_index: 0
  width: 728
  height: 544
  pixel_format: RGB888
  # Picamera2/libcamera's RGB888 name is B, G, R byte order in memory.
  memory_order: BGR
  orientation_degrees: 180
  target_hz: 10
  buffer_count: 4
  handoff: async_latest_pair
  zero_copy_camera_input: true
  hardware_trigger:
    enabled: true
    driver_mode: external_xtrig
    requires_always_on_overlay: true
    gpiochip: /dev/gpiochip0
    line: 17
    idle_level: high
    active_level: low
    pulse_width_us: 3000
    startup_priming_pulses: 5
    pair_tolerance_us: 500
  exposure_time_us: 3000
  analogue_gain: 1.5

rectification:
  # Calibration files are tied to the camera units, not their current physical
  # sides. Camera 1 uses the originally-right calibration and camera 0 uses the
  # originally-left calibration. This mapping gives 0.34 px median vertical
  # residual; assigning by side gives about 20 px and invalid stereo depth.
  left_calibration: calibration/nuvo_reference/front_right.yaml
  right_calibration: calibration/nuvo_reference/front_left.yaml
  map_format: fixed_point
  # The depth path converts the camera-owned BGR views to one-channel images
  # before remapping. Full-color left rectification runs only when the
  # throttled compressed-image output is due.
  depth_preprocessing: grayscale_before_rectification
  color_rectification: on_compressed_output_schedule

stereo:
  backend: cpu_sgbm
  output_width: 728
  output_height: 544
  max_disparity: 192
  backends:
    cpu_sgbm:
      working_width: 364
      working_height: 272
      working_disparities: 96
      block_size: 5
      mode: sgbm_3way
      uniqueness_ratio: 5
      speckle_window_size: 50
      speckle_range: 2
      opencv_threads: 1
    hailort:
      model: las2_s
      model_input_width: 736
      model_input_height: 544
      crop_output_width: 728

outputs:
  disparity_hz: 10
  disparity_topic: /camera/front/disparity
  compressed_image_hz: 2
  compressed_image_topic: /camera/front/left/image_rect/compressed
  jpeg_quality: 75
  left_camera_info_topic: /camera/front/left/camera_info
  diagnostics_topic: /camera/front/depthd/diagnostics
  future_obstacle_cloud_topic: /camera/front/obstacles

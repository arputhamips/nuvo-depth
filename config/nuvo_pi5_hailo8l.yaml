schema_version: 1

capture:
  backend: libcamera
  # Verified on the supplied rig by disparity-direction testing. These are
  # logical assignments; keep them configurable because libcamera indices can
  # change if the physical topology changes.
  left_camera_index: 1
  right_camera_index: 0
  width: 728
  height: 544
  pixel_format: RGB888
  # Picamera2/libcamera's RGB888 name is B, G, R byte order in memory.
  memory_order: BGR
  orientation_degrees: 180
  target_hz: 10
  buffer_count: 4
  handoff: async_latest_pair
  zero_copy_camera_input: true
  hardware_trigger:
    enabled: true
    driver_mode: external_xtrig
    requires_always_on_overlay: true
    gpiochip: /dev/gpiochip0
    line: 17
    idle_level: high
    active_level: low
    # Physical IMX296 exposure is the shared XTR low pulse. Never exceed
    # 8000 us (1/125 s) while the robot is operating.
    pulse_width_us: 8000
    startup_priming_pulses: 5
    pair_tolerance_us: 500
  exposure_time_us: 8000
  analogue_gain: 2.0
  colour_gains: [2.4771, 2.3425]
  auto_exposure:
    enabled: true
    metering_roi: [160, 96, 728, 420]
    target_median: 75
    median_deadband: [65, 85]
    dark_threshold: 16
    clipping_threshold: 245
    max_clipped_fraction: 0.005
    min_shutter_us: 250
    max_shutter_us: 8000
    min_analogue_gain: 1.0
    max_analogue_gain: 3.0
    update_interval_frames: 2
    settle_frames_after_update: 4

rectification:
  backend: cpu_opencv
  fallback_backend: cpu_opencv
  allow_fallback: true
  # Calibration files are tied to the camera units, not their current physical
  # sides. Camera 1 uses the originally-right calibration and camera 0 uses the
  # originally-left calibration. This mapping gives 0.34 px median vertical
  # residual; assigning by side gives about 20 px and invalid stereo depth.
  left_calibration: calibration/nuvo_reference/front_right.yaml
  right_calibration: calibration/nuvo_reference/front_left.yaml
  map_format: fixed_point
  # The depth path converts the camera-owned BGR views to one-channel images
  # before remapping. Full-color left rectification runs only when the
  # throttled JPEG or an enabled semantic model is due.
  depth_preprocessing: grayscale_before_rectification
  color_rectification: on_jpeg_or_semantic_schedule

stereo:
  backend: cpu_sgbm
  output_width: 728
  output_height: 544
  max_disparity: 128
  backends:
    cpu_sgbm:
      working_width: 364
      working_height: 272
      working_disparities: 64
      block_size: 5
      mode: sgbm_3way
      uniqueness_ratio: 1
      speckle_window_size: 30
      speckle_range: 2
      opencv_threads: 1
    hailort:
      model: las2_s
      model_input_width: 736
      model_input_height: 544
      crop_output_width: 728

outputs:
  disparity_hz: 10
  disparity_topic: /camera/front/disparity
  metric_depth_enabled: false
  compressed_image_hz: 2
  compressed_image_topic: /camera/front/left/image_rect/compressed
  jpeg_quality: 75
  left_camera_info_topic: /camera/front/left/camera_info
  diagnostics_topic: /camera/front/depthd/diagnostics
  obstacle_cloud_enabled: true
  obstacle_cloud_topic: /camera/front/obstacles
  result_ring_path: /run/depthd/results.ring
  result_ring_slots: 4
  # Off by default. Native semantics consumes the owned rectified color frame;
  # this plane is retained only for an explicit grayscale diagnostic consumer.
  result_ring_left_mono_enabled: false

semantic:
  # The portable module and ABI are production-ready. Keep hardware execution
  # gated until both HEFs pass artifact verification and live Hailo-8L tests.
  enabled: false
  backend: hailort
  frame_source: left_rectified_color_bgr
  queue_policy: latest_only
  queue_capacity: 1
  result_ring_path: /run/depthd/semantic.ring
  result_ring_slots: 4
  output_library: build/libdepthd_semantic_output.so
  target_frame: base_link
  models:
    instances:
      name: yolov8s
      hef_path: /home/cam/nuvo-base/data/models/hailo/front_semantic.hef
      manifest: models/semantic/manifest.json
      target_hz: 5
    dense_regions:
      name: segformer_b0_bn
      hef_path: /home/cam/nuvo-base/data/models/hailo/segformer_b0_bn.hef
      manifest: models/semantic/manifest.json
      target_hz: 5
  preview:
    enabled: false
    max_jpeg_bytes: 524288
  fusion:
    min_range_m: 0.50
    max_range_m: 6.00
    sample_step_px: 2
    inner_box_fraction: 0.60
    min_valid_samples: 12
    min_valid_fraction: 0.05
    max_range_stddev_m: 0.50
    living_stop_range_m: 3.00
    living_stop_bearing_abs_rad: 0.90
    stop_on_unranged_living: true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nuvo-depth"
version = "0.1.1b8"
description = "Bounded Nuvo Depth camera client and recorder"
requires-python = ">=3.11"
license = {text = "GPL-3.0-or-later"}

[project.urls]
Homepage = "https://nuvohardware.com/"
Documentation = "https://docs.nuvohardware.com/vision-one/sdk/python"
Source = "https://github.com/arputhamips/nuvo-depth"
Issues = "https://github.com/arputhamips/nuvo-depth/issues"

[tool.setuptools]
license-files = ["LICENSE"]

[project.scripts]
nuvo-record = "nuvo_depth.recorder:main"
nuvo-replay = "nuvo_depth.replay:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["nuvo_depth*"]

name: Required host and browser checks
run-name: ${{ github.event_name == 'workflow_dispatch' && inputs.inject_failure != 'none' && format('INTENTIONAL FAILURE PROBE - {0} - {1}', inputs.inject_failure, github.ref_name) || format('Required host and browser checks - {0}', github.ref_name) }}
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      inject_failure:
        description: Disposable workflow qualification; each injected regression MUST make this run fail
        type: choice
        options: [none, native, sdk, browser]
        default: none
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      native: ${{ steps.route.outputs.native }}
      browser: ${{ steps.route.outputs.browser }}
    steps:
      - name: Label intentional failure qualification
        if: github.event_name == 'workflow_dispatch' && inputs.inject_failure != 'none'
        env:
          PROBE: ${{ inputs.inject_failure }}
        run: |
          echo "::warning title=Intentional CI qualification::The $PROBE regression is deliberately injected. This run must fail; required checks are unchanged."
          {
            echo '## Intentional failure qualification'
            printf 'Requested probe: **%s**.\n\n' "$PROBE"
            echo 'A regression is deliberately injected into this run. The affected checks and required aggregator must fail. This is not a normal product validation run.'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 0, persist-credentials: false}
      - id: route
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 tools/ci/required_checks.py --base "$BASE_SHA" >> "$GITHUB_OUTPUT"
      - run: python3 tools/check_setup_consistency.py
  host:
    needs: plan
    if: needs.plan.outputs.native == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: {preset: [minimal-host, development-full]}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - env:
          PRESET: ${{ matrix.preset }}
        run: |
          sudo --preserve-env=GITHUB_ACTIONS bash tools/ci/use-ubuntu-mirror.sh
          bash tools/dev/bootstrap-host.sh "$([ "$PRESET" = development-full ] && echo --full || echo --minimal)"
      - name: Inject an explicitly requested disposable regression
        env:
          PROBE: ${{ inputs.inject_failure || 'none' }}
        run: |
          if [ "$PROBE" = native ]; then echo '#error deliberate-native-CI-qualification' >> src/contract.cpp; fi
          if [ "$PROBE" = sdk ]; then sed -i '1i raise RuntimeError("deliberate SDK CI qualification")' sdk/python/nuvo_depth/__init__.py; fi
      - run: cmake --preset ${{ matrix.preset }}
      - run: cmake --build --preset ${{ matrix.preset }} -j 2
      - run: ctest --preset ${{ matrix.preset }} --output-on-failure
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: host-${{ matrix.preset }}-${{ github.run_id }}
          path: |
            build/${{ matrix.preset }}/Testing/
            output/dev-environment/
          if-no-files-found: error
  browser:
    needs: plan
    if: needs.plan.outputs.browser == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - run: |
          sudo --preserve-env=GITHUB_ACTIONS bash tools/ci/use-ubuntu-mirror.sh
          bash tools/dev/bootstrap-host.sh --full
      - run: cmake --preset development-full && cmake --build --preset development-full --target nuvo-gateway -j 2
      - run: npm --prefix tools/dev/browser ci && npm --prefix tools/dev/browser exec -- playwright install --with-deps chromium
      - name: Render console fixtures and actual gateway journeys
        env:
          NUVO_PLAYWRIGHT_MODULE: ${{ github.workspace }}/tools/dev/browser/node_modules/playwright
          PROBE: ${{ inputs.inject_failure || 'none' }}
        run: |
          if [ "$PROBE" = browser ]; then sed -i 's/id="firstDepthStart"/id="deliberatelyBrokenFirstDepthStart"/' web/index.html; fi
          node tests/first_use_browser_test.cjs
          python3 tools/dev/gateway_fixture.py --binary build/development-full/nuvo-gateway --manifest output/gateway-fixture/manifest.json --control output/gateway-fixture/control.json &
          fixture_pid=$!
          trap 'kill "$fixture_pid" 2>/dev/null || true; wait "$fixture_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do test -f output/gateway-fixture/manifest.json && break; sleep 1; done
          test -f output/gateway-fixture/manifest.json
          node tests/gateway_browser_test.cjs output/gateway-fixture/manifest.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: rendered-browser-${{ github.run_id }}
          path: |
            output/first-use-browser/
            output/gateway-browser/
          if-no-files-found: error
  minimum-cmake:
    needs: plan
    if: needs.plan.outputs.native == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - run: |
          sudo --preserve-env=GITHUB_ACTIONS bash tools/ci/use-ubuntu-mirror.sh
          bash tools/dev/bootstrap-host.sh --minimal
      - name: Build with the declared minimum; reject an older version clearly
        run: |
          python3 -m venv "$RUNNER_TEMP/cmake325"
          "$RUNNER_TEMP/cmake325/bin/pip" install cmake==3.25.2
          "$RUNNER_TEMP/cmake325/bin/cmake" --preset minimal-host
          "$RUNNER_TEMP/cmake325/bin/cmake" --build --preset minimal-host -j 2
          "$RUNNER_TEMP/cmake325/bin/ctest" --preset minimal-host --output-on-failure
          python3 -m venv "$RUNNER_TEMP/cmake324"
          "$RUNNER_TEMP/cmake324/bin/pip" install cmake==3.24.3
          if "$RUNNER_TEMP/cmake324/bin/cmake" -S . -B "$RUNNER_TEMP/below-minimum" > below-minimum.txt 2>&1; then exit 1; fi
          grep '3.25 or higher is required' below-minimum.txt
  debian-clean:
    needs: plan
    if: needs.plan.outputs.native == 'true'
    runs-on: ubuntu-24.04
    container: debian:trixie-slim@sha256:a29215f6a35e51e22adffa17f89e9d2ef06214e64a2bad10d765c46aea49f11f
    timeout-minutes: 30
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - run: bash tools/dev/bootstrap-host.sh --full
      - run: cmake --preset development-full && cmake --build --preset development-full -j 2 && ctest --preset development-full --output-on-failure
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: clean-debian-${{ github.run_id }}
          path: |
            output/dev-environment/
            build/development-full/Testing/
          if-no-files-found: error
  sdk:
    needs: plan
    if: needs.plan.outputs.native == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '${{ matrix.python }}'}
      - name: Inject the requested installed-SDK regression
        if: github.event_name == 'workflow_dispatch' && inputs.inject_failure == 'sdk'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('sdk/python/nuvo_depth/__init__.py')
          path.write_text('raise RuntimeError("deliberate installed SDK CI qualification")\n' + path.read_text(), newline='\n')
          PY
      - run: python -m pip install ./sdk/python "cryptography>=42"
      - run: python -m nuvo_depth.examples --help
      - run: python tests/python_sdk_test.py
      - run: python tests/first_use_test.py
      - run: python tests/sdk_tls_test.py
  cpp-client:
    needs: plan
    if: needs.plan.outputs.native == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - run: |
          sudo --preserve-env=GITHUB_ACTIONS bash tools/ci/use-ubuntu-mirror.sh
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ nlohmann-json3-dev libboost-system-dev libssl-dev libc-ares-dev
      - name: Independent installed SDK and real transport contracts
        run: |
          cmake -S sdk/cpp -B build/cpp-client -G Ninja -DCMAKE_BUILD_TYPE=Release -DNUVO_CLIENT_BUILD_TESTS=ON
          cmake --build build/cpp-client -j2
          ctest --test-dir build/cpp-client --output-on-failure
          cmake -S sdk/cpp -B build/cpp-client-local -G Ninja -DNUVO_CLIENT_WITH_HTTPS=OFF -DNUVO_CLIENT_BUILD_TESTS=ON
          cmake --build build/cpp-client-local -j2
          ctest --test-dir build/cpp-client-local --output-on-failure
      - name: Canonical serializer and Python recording compatibility
        run: |
          cmake --preset minimal-host -B build/cpp-client-native
          cmake --build build/cpp-client-native --target depthd_frame_wire_test -j2
          python3 tests/cpp_client_roundtrip_test.py build/cpp-client-native/depthd_frame_wire_test build/cpp-client/nuvo_client_test
          python3 tools/export_cpp_client.py build/client-export
          cmake -S build/client-export -B build/client-export-test -G Ninja -DNUVO_CLIENT_WITH_HTTPS=OFF -DNUVO_CLIENT_BUILD_TESTS=ON
          cmake --build build/client-export-test -j2
          ctest --test-dir build/client-export-test --output-on-failure
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: cpp-client-${{ github.run_id }}
          path: |
            build/cpp-client/Testing/
            build/cpp-client-local/Testing/
            build/client-export-test/Testing/
            build/client-export/SOURCE-MANIFEST.json
          if-no-files-found: error
  native-runtime:
    needs: plan
    if: needs.plan.outputs.native == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - name: Pull the pinned public consumer image
        run: docker pull ros:jazzy-ros-base@sha256:103b6c417973394659af6804d4917cd489b91e5ed22eb7bef263025a3bed2410
      - name: Existing nonroot container mount survives native service recovery
        run: sudo python3 tests/native_runtime_directory_test.py --output output/native-runtime-lifecycle
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: native-runtime-${{ github.run_id }}
          path: output/native-runtime-lifecycle/*.json
          if-no-files-found: error
  required:
    if: always()
    needs: [plan, host, browser, sdk, cpp-client, native-runtime, minimum-cmake, debian-clean]
    runs-on: ubuntu-24.04
    steps:
      - env:
          PLAN: ${{ needs.plan.result }}
          NATIVE_NEEDED: ${{ needs.plan.outputs.native }}
          HOST: ${{ needs.host.result }}
          BROWSER_NEEDED: ${{ needs.plan.outputs.browser }}
          BROWSER: ${{ needs.browser.result }}
          SDK: ${{ needs.sdk.result }}
          CPP_CLIENT: ${{ needs.cpp-client.result }}
          NATIVE_RUNTIME: ${{ needs.native-runtime.result }}
          MINIMUM: ${{ needs.minimum-cmake.result }}
          DEBIAN: ${{ needs.debian-clean.result }}
        run: |
          test "$PLAN" = success
          if [ "$NATIVE_NEEDED" = true ]; then test "$HOST" = success; else test "$HOST" = skipped; fi
          if [ "$BROWSER_NEEDED" = true ]; then test "$BROWSER" = success; else test "$BROWSER" = skipped; fi
          if [ "$NATIVE_NEEDED" = true ]; then test "$SDK" = success; else test "$SDK" = skipped; fi
          if [ "$NATIVE_NEEDED" = true ]; then test "$CPP_CLIENT" = success; else test "$CPP_CLIENT" = skipped; fi
          if [ "$NATIVE_NEEDED" = true ]; then test "$NATIVE_RUNTIME" = success; else test "$NATIVE_RUNTIME" = skipped; fi
          if [ "$NATIVE_NEEDED" = true ]; then test "$MINIMUM" = success && test "$DEBIAN" = success; else test "$MINIMUM" = skipped && test "$DEBIAN" = skipped; fi

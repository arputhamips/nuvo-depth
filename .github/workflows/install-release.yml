name: Prepare signed release draft
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing reviewed tag, matching the Debian changelog (vX.Y.Z)
        required: true
        type: string
      channel:
        description: Beta for internal testing, or stable candidate for review
        required: true
        default: beta
        type: choice
        options: [beta, stable]
permissions:
  contents: read
concurrency:
  group: install-release-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      source_commit: ${{ steps.tag.outputs.source_commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate reviewed tag and complete platform manifest
        id: tag
        env:
          NUVO_TAG: ${{ inputs.tag }}
          NUVO_CHANNEL: ${{ inputs.channel }}
        run: |
          [[ "$NUVO_TAG" =~ ^v[0-9][A-Za-z0-9.+-]*$ ]]
          git check-ref-format "refs/tags/$NUVO_TAG"
          commit="$(git rev-parse "refs/tags/$NUVO_TAG^{commit}")"
          git merge-base --is-ancestor "$commit" HEAD
          git checkout --detach "$commit"
          version="$(dpkg-parsechangelog -S Version)"
          test "$NUVO_TAG" = "v${version//\~/-}"
          python3 tools/release_notes.py --tag "$NUVO_TAG" --channel "$NUVO_CHANNEL" \
            --output "$RUNNER_TEMP/release-notes.md"
          echo "source_commit=$commit" >> "$GITHUB_OUTPUT"
  build:
    needs: prepare
    uses: ./.github/workflows/package-build.yml
    with:
      source_ref: ${{ needs.prepare.outputs.source_commit }}
  sign-and-release:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: nuvo-install-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.source_commit }}
          path: release-source
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nuvo-debian-arm64
          path: output/packages
      - name: Check source provenance and sign exact package cohort
        env:
          NUVO_SIGNING_KEY: ${{ secrets.NUVO_RELEASE_ED25519_PEM }}
          NUVO_REPOSITORY: ${{ github.repository }}
          NUVO_TAG: ${{ inputs.tag }}
          NUVO_SOURCE_COMMIT: ${{ needs.prepare.outputs.source_commit }}
        run: |
          umask 077
          key_file="$(mktemp)"
          trap 'rm -f -- "$key_file" "$key_file.pub"' EXIT
          test -n "$NUVO_SIGNING_KEY"
          printf '%s\n' "$NUVO_SIGNING_KEY" > "$key_file"
          unset NUVO_SIGNING_KEY
          openssl pkey -in "$key_file" -pubout -out "$key_file.pub"
          cmp "$key_file.pub" deployment/release-signing.pub
          cmp deployment/release-signing.pub release-source/deployment/release-signing.pub
          python3 - <<'PY'
          import json, os
          record = json.load(open('output/packages/build-record.json'))
          assert record['source_commit'] == os.environ['NUVO_SOURCE_COMMIT'], 'build source mismatch'
          PY
          extras=(--extra output/packages/nuvo-depth-source.tar.gz --extra output/packages/build-record.json \
                  --extra output/packages/build-packages.txt --extra output/packages/ctest.log)
          for file in output/packages/*.buildinfo; do extras+=(--extra "$file"); done
          python3 tools/build_install_release.py --source release-source --packages output/packages \
            --output output/install-release --publication-output output/downloads --repository "$NUVO_REPOSITORY" --tag "$NUVO_TAG" \
            --version "$(dpkg-parsechangelog -l release-source/debian/changelog -S Version)" \
            --platform release-source/deployment/release-platform.json --private-key "$key_file" "${extras[@]}"
      - name: Prepare reviewed release notes and draft
        env:
          GH_TOKEN: ${{ github.token }}
          NUVO_REPOSITORY: ${{ github.repository }}
          NUVO_TAG: ${{ inputs.tag }}
          NUVO_CHANNEL: ${{ inputs.channel }}
        run: |
          python3 tools/release_notes.py --source release-source --repository "$NUVO_REPOSITORY" \
            --tag "$NUVO_TAG" --channel "$NUVO_CHANNEL" --output output/release-notes.md
          flags=(--draft --latest=false)
          if [[ "$NUVO_CHANNEL" == beta ]]; then flags+=(--prerelease); fi
          # Existing tags/assets are never overwritten. Publishing is a separate human decision.
          gh release create "$NUVO_TAG" output/downloads/* --repo "$NUVO_REPOSITORY" \
            --verify-tag "${flags[@]}" --title "Nuvo Depth $NUVO_TAG" --notes-file output/release-notes.md
          echo "Draft ready for review: https://github.com/$NUVO_REPOSITORY/releases" >> "$GITHUB_STEP_SUMMARY"

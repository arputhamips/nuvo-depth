name: Prepare signed release draft
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing reviewed tag, matching the Debian changelog (vX.Y.Z)
        required: true
        type: string
      channel:
        description: Beta for internal testing, or stable candidate for review
        required: true
        default: beta
        type: choice
        options: [beta, stable]
permissions:
  contents: read
concurrency:
  group: install-release-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      source_commit: ${{ steps.tag.outputs.source_commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate reviewed tag and complete platform manifest
        id: tag
        env:
          NUVO_TAG: ${{ inputs.tag }}
          NUVO_CHANNEL: ${{ inputs.channel }}
        run: |
          [[ "$NUVO_TAG" =~ ^v[0-9][A-Za-z0-9.+-]*$ ]]
          git check-ref-format "refs/tags/$NUVO_TAG"
          commit="$(git rev-parse "refs/tags/$NUVO_TAG^{commit}")"
          git merge-base --is-ancestor "$commit" HEAD
          git checkout --detach "$commit"
          version="$(dpkg-parsechangelog -S Version)"
          test "$NUVO_TAG" = "v${version//\~/-}"
          python3 tools/release_notes.py --tag "$NUVO_TAG" --channel "$NUVO_CHANNEL" --profiles appliance minimal \
            --output "$RUNNER_TEMP/release-notes.md"
          echo "source_commit=$commit" >> "$GITHUB_OUTPUT"
  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        profile: [appliance, minimal]
    uses: ./.github/workflows/package-build.yml
    with:
      source_ref: ${{ needs.prepare.outputs.source_commit }}
      package_profile: ${{ matrix.profile }}
  sign-and-release:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: nuvo-install-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.source_commit }}
          path: release-source
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nuvo-debian-arm64
          path: output/packages/appliance
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nuvo-minimal-arm64
          path: output/packages/minimal
      - name: Check source provenance and sign exact package cohort
        env:
          NUVO_SIGNING_KEY: ${{ secrets.NUVO_RELEASE_ED25519_PEM }}
          NUVO_REPOSITORY: ${{ github.repository }}
          NUVO_TAG: ${{ inputs.tag }}
          NUVO_SOURCE_COMMIT: ${{ needs.prepare.outputs.source_commit }}
        run: |
          umask 077
          key_file="$(mktemp)"
          trap 'rm -f -- "$key_file" "$key_file.pub"' EXIT
          test -n "$NUVO_SIGNING_KEY"
          printf '%s\n' "$NUVO_SIGNING_KEY" > "$key_file"
          unset NUVO_SIGNING_KEY
          openssl pkey -in "$key_file" -pubout -out "$key_file.pub"
          cmp "$key_file.pub" deployment/release-signing.pub
          cmp deployment/release-signing.pub release-source/deployment/release-signing.pub
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          version = subprocess.check_output(['dpkg-parsechangelog', '-l', 'release-source/debian/changelog', '-S', 'Version'], text=True).strip()
          for profile in ('appliance', 'minimal'):
              record = json.loads(pathlib.Path(f'output/packages/{profile}/build-record.json').read_text())
              assert record['source_commit'] == os.environ['NUVO_SOURCE_COMMIT'], 'build source mismatch'
              assert record['version'] == version, 'build version mismatch'
              assert record['profile'] == profile, 'build profile mismatch'
              assert (record['architecture'], record['codename']) == ('arm64', 'trixie'), 'build platform mismatch'
          PY
          cmp output/packages/appliance/nuvo-depth-source.tar.gz output/packages/minimal/nuvo-depth-source.tar.gz
          mkdir -p output/downloads
          for profile in appliance minimal; do
            packages="output/packages/$profile"
            extras=(--extra "$packages/nuvo-depth-source.tar.gz" --extra "$packages/build-record.json" \
                    --extra "$packages/build-packages.txt" --extra "$packages/ctest.log")
            for file in "$packages"/*.buildinfo; do extras+=(--extra "$file"); done
            python3 tools/build_install_release.py --source release-source --packages "$packages" --profile "$profile" \
              --output "output/install-release/$profile" --publication-output "output/profile-downloads/$profile" \
              --repository "$NUVO_REPOSITORY" --tag "$NUVO_TAG" \
              --version "$(dpkg-parsechangelog -l release-source/debian/changelog -S Version)" \
              --platform release-source/deployment/release-platform.json --private-key "$key_file" "${extras[@]}"
            for file in output/profile-downloads/"$profile"/*; do
              test ! -e "output/downloads/$(basename "$file")"
              cp "$file" output/downloads/
            done
          done
          test "$(find output/downloads -maxdepth 1 -type f | wc -l)" -eq 6
      - name: Prepare reviewed release notes and draft
        env:
          GH_TOKEN: ${{ github.token }}
          NUVO_REPOSITORY: ${{ github.repository }}
          NUVO_TAG: ${{ inputs.tag }}
          NUVO_CHANNEL: ${{ inputs.channel }}
        run: |
          python3 tools/release_notes.py --source release-source --repository "$NUVO_REPOSITORY" \
            --tag "$NUVO_TAG" --channel "$NUVO_CHANNEL" --profiles appliance minimal --output output/release-notes.md
          flags=(--draft --latest=false)
          if [[ "$NUVO_CHANNEL" == beta ]]; then flags+=(--prerelease); fi
          # Existing tags/assets are never overwritten. Publishing is a separate human decision.
          gh release create "$NUVO_TAG" output/downloads/* --repo "$NUVO_REPOSITORY" \
            --verify-tag "${flags[@]}" --title "Nuvo Depth $NUVO_TAG" --notes-file output/release-notes.md
          echo "Draft ready for review: https://github.com/$NUVO_REPOSITORY/releases" >> "$GITHUB_STEP_SUMMARY"

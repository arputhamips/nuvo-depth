name: Signed install release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing reviewed tag, matching the Debian changelog (vX.Y.Z)
        required: true
        type: string
      publication:
        description: Release visibility after every build, test and signing check passes
        required: true
        default: draft
        type: choice
        options: [draft, prerelease, publish]
permissions:
  contents: read
concurrency:
  group: install-release-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      source_commit: ${{ steps.tag.outputs.source_commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate reviewed tag and complete platform manifest
        id: tag
        env:
          NUVO_TAG: ${{ inputs.tag }}
        run: |
          [[ "$NUVO_TAG" =~ ^v[0-9][A-Za-z0-9.+-]*$ ]]
          git check-ref-format "refs/tags/$NUVO_TAG"
          commit="$(git rev-parse "refs/tags/$NUVO_TAG^{commit}")"
          git merge-base --is-ancestor "$commit" HEAD
          git checkout --detach "$commit"
          version="$(dpkg-parsechangelog -S Version)"
          test "$NUVO_TAG" = "v${version//\~/-}"
          python3 - <<'PY'
          import json, sys
          sys.path.insert(0, 'tools')
          import nuvo_release
          nuvo_release.validate_platform(json.load(open('deployment/release-platform.json')))
          PY
          echo "source_commit=$commit" >> "$GITHUB_OUTPUT"
  build:
    needs: prepare
    uses: ./.github/workflows/package-build.yml
    with:
      source_ref: ${{ needs.prepare.outputs.source_commit }}
  sign-and-release:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: nuvo-install-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.source_commit }}
          path: release-source
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nuvo-debian-arm64
          path: output/packages
      - name: Check source provenance and sign exact package cohort
        env:
          NUVO_SIGNING_KEY: ${{ secrets.NUVO_RELEASE_ED25519_PEM }}
          NUVO_REPOSITORY: ${{ github.repository }}
          NUVO_TAG: ${{ inputs.tag }}
          NUVO_SOURCE_COMMIT: ${{ needs.prepare.outputs.source_commit }}
        run: |
          umask 077
          key_file="$(mktemp)"
          trap 'rm -f -- "$key_file" "$key_file.pub"' EXIT
          test -n "$NUVO_SIGNING_KEY"
          printf '%s\n' "$NUVO_SIGNING_KEY" > "$key_file"
          unset NUVO_SIGNING_KEY
          openssl pkey -in "$key_file" -pubout -out "$key_file.pub"
          cmp "$key_file.pub" deployment/release-signing.pub
          cmp deployment/release-signing.pub release-source/deployment/release-signing.pub
          python3 - <<'PY'
          import json, os
          record = json.load(open('output/packages/build-record.json'))
          assert record['source_commit'] == os.environ['NUVO_SOURCE_COMMIT'], 'build source mismatch'
          PY
          extras=(--extra output/packages/nuvo-depth-source.tar.gz --extra output/packages/build-record.json \
                  --extra output/packages/build-packages.txt --extra output/packages/ctest.log)
          for file in output/packages/*.buildinfo; do extras+=(--extra "$file"); done
          python3 tools/build_install_release.py --source release-source --packages output/packages \
            --output output/install-release --publication-output output/downloads --repository "$NUVO_REPOSITORY" --tag "$NUVO_TAG" \
            --version "$(dpkg-parsechangelog -l release-source/debian/changelog -S Version)" \
            --platform release-source/deployment/release-platform.json --private-key "$key_file" "${extras[@]}"
      - name: Publish selected release visibility
        env:
          GH_TOKEN: ${{ github.token }}
          NUVO_REPOSITORY: ${{ github.repository }}
          NUVO_TAG: ${{ inputs.tag }}
          NUVO_PUBLICATION: ${{ inputs.publication }}
        run: |
          python3 - <<'PY'
          import os, pathlib
          repo, tag = os.environ['NUVO_REPOSITORY'], os.environ['NUVO_TAG']
          pathlib.Path('output/release-notes.md').write_text(f'''## Install Nuvo Depth

          On a Raspberry Pi 5 running the supported Raspberry Pi OS Lite 64-bit Trixie image, open a terminal and run:

          ```bash
          curl -fsSL https://github.com/{repo}/releases/download/{tag}/install-nuvo-depth.sh | sudo bash
          ```

          Answer the terminal questions, then open the console URL printed at the end. The installer selects all packages and verifies their signatures automatically. No GitHub account or SSH key is needed.

          | Download | Purpose |
          | --- | --- |
          | `install-nuvo-depth.sh` | The installer used by the command above. |
          | `nuvo-depth-pi5-arm64.tar.gz` | Complete installer bundle, including packages, matching GPL source, licenses and build records. Useful for caching; OS dependencies still need APT access/cache. |
          | `nuvo-depth-pi5-arm64.tar.gz.sig` | Signature checked automatically by the installer. |

          GitHub's additional Source code downloads are for developers. You do not need to select individual packages.

          [Supported OS and full instructions](https://github.com/{repo}/blob/{tag}/docs/install.md) · [Release signing and building from source](https://github.com/{repo}/blob/{tag}/docs/releases.md)

          Factory provisioning adds `-s -- --factory --wifi-country CC` after `sudo bash`, using the actual operating country and any per-unit calibration inputs. Package tests do not certify per-unit calibration, electrical safety or manufacturing acceptance.
          ''')
          PY
          # No clobber/update: an existing tag's release assets are never overwritten.
          gh release create "$NUVO_TAG" output/downloads/* --repo "$NUVO_REPOSITORY" \
            --verify-tag --draft --title "Nuvo Depth $NUVO_TAG" --notes-file output/release-notes.md
          case "$NUVO_PUBLICATION" in
            draft) ;;
            prerelease) gh release edit "$NUVO_TAG" --repo "$NUVO_REPOSITORY" --draft=false --prerelease --latest=false ;;
            publish) gh release edit "$NUVO_TAG" --repo "$NUVO_REPOSITORY" --draft=false --prerelease=false --latest ;;
            *) exit 2 ;;
          esac
          echo "Release: https://github.com/$NUVO_REPOSITORY/releases/tag/$NUVO_TAG" >> "$GITHUB_STEP_SUMMARY"

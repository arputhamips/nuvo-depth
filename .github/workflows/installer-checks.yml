name: Installer checks
on:
  push:
    paths:
      - 'install-nuvo-depth.sh'
      - 'install-nuvo-depth-minimal.sh'
      - 'tests/minimal*'
      - 'tools/**'
      - 'web/**'
      - 'sdk/python/**'
      - 'tests/first_use*'
      - 'tests/web*'
      - 'deployment/**'
      - 'debian/**'
      - 'tests/install*'
      - 'tests/release_policy_test.py'
      - 'tests/latest_release_test.py'
      - 'tests/nuvoctl_test.py'
      - 'tests/system_agent_test.py'
      - 'CHANGELOG.md'
      - '.github/workflows/installer-checks.yml'
      - '.github/workflows/install-release.yml'
  pull_request:
    paths:
      - 'install-nuvo-depth.sh'
      - 'install-nuvo-depth-minimal.sh'
      - 'tests/minimal*'
      - 'tools/**'
      - 'web/**'
      - 'sdk/python/**'
      - 'tests/first_use*'
      - 'tests/web*'
      - 'deployment/**'
      - 'debian/**'
      - 'tests/install*'
      - 'tests/release_policy_test.py'
      - 'tests/latest_release_test.py'
      - 'tests/nuvoctl_test.py'
      - 'tests/system_agent_test.py'
      - 'CHANGELOG.md'
      - '.github/workflows/installer-checks.yml'
      - '.github/workflows/install-release.yml'

permissions:
  contents: read
jobs:
  installer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate shell and provisioning contracts
        run: |
          bash -n install-nuvo-depth.sh
          bash -n install-nuvo-depth-minimal.sh
          python3 tests/minimal_cli_test.py
          python3 tests/calibration_readiness_test.py
          python3 tests/calibration_import_test.py
          python3 tests/minimal_install_test.py
          python3 tests/install_provisioning_test.py
          python3 tests/install_release_test.py
          python3 tests/latest_release_test.py
          python3 tests/first_use_test.py
          python3 tests/python_sdk_test.py
          python3 tests/web_ui_static_test.py
          python3 tests/release_policy_test.py
          python3 tests/nuvoctl_test.py
          python3 tests/system_agent_test.py
